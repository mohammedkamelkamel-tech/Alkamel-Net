name: Android Build 2.0.0 from 1.9.9

on:
  workflow_dispatch:
  push:
    branches:
      - release/2.0.0-from-1.9.9

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/Alkamel-Net-Android
    steps:
      - name: Checkout 1.9.9-based source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate project
        run: python3 scripts/validate_project.py

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alkamel-Net-2.0.0-from-1.9.9-debug-apk
          path: source/Alkamel-Net-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
