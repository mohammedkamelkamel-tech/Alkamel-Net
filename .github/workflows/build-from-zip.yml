name: Extract and Build Alkamel-Net APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose uploaded archive
        shell: bash
        run: |
          set -euxo pipefail
          echo "Repository files:"
          find . -maxdepth 3 -type f -not -path './.git/*' -printf '%p (%s bytes)\n'
          ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' ! -path './.git/*' -print -quit)"
          test -n "$ZIP_FILE" || { echo "::error::No ZIP archive found in repository"; exit 1; }
          echo "Using archive: $ZIP_FILE"
          ls -lh "$ZIP_FILE"
          file "$ZIP_FILE"
          unzip -t "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | head -200
          SETTINGS="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          test -n "$SETTINGS" || { echo "::error::ZIP extracted but settings.gradle(.kts) was not found"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle" || { echo "::error::Android app module build.gradle not found"; exit 1; }
          echo "Detected project root: $PROJECT_DIR"
          echo "Gradle files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \( -name '*gradle*' -o -name 'gradle-wrapper.properties' \) -print
      - name: Inspect original portal UI source
        shell: bash
        run: |
          set -euxo pipefail
          echo "HTML and JS assets:"
          find "$PROJECT_DIR/app/src/main/assets" -type f | sort
          echo "Relevant source matches:"
          grep -RniE 'البث المباشر|بث HD|سرعة الكرت|تحديثات جوجل|استراحة|استراحه|اعتماد السرعة|سرعة حالية|1536k|4096k|تم تحديث بيانات الحساب|اسم المشترك|m3u8|\.mp4|stream|live|tv\.html|openHd|applySelectedSpeed|speedOptions|function player' "$PROJECT_DIR/app/src/main/assets" --include='*.html' --include='*.js' | head -450 || true
          echo "Wrapper JavaScript lines 23-42:"
          sed -n '23,42p' "$PROJECT_DIR/app/src/main/assets/home.html"
          echo "Portal live controls:"
          sed -n '35,55p' "$PROJECT_DIR/app/src/main/assets/original/index.html"
      - name: Inspect stream URLs and speed handlers
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets" <<'PY'
          import pathlib,sys,re
          root=pathlib.Path(sys.argv[1])
          terms=('m3u8','live','stream','player(','openHd','speed','applySelectedSpeed','onchange','syy','changeSpeed','setSpeed')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in ('.html','.js','.json'): continue
              try: s=p.read_text(encoding='utf-8',errors='ignore')
              except Exception: continue
              for term in terms:
                  start=0; hits=0
                  while hits<4:
                      i=s.lower().find(term.lower(),start)
                      if i<0: break
                      a=max(0,i-180); b=min(len(s),i+320)
                      print(f'\nSOURCE {p.relative_to(root)} TERM {term}: {s[a:b]}')
                      start=i+len(term); hits+=1
          PY
      - name: Apply and verify portal UI fixes
        shell: bash
        run: |
          set -euo pipefail
          HD_FILE="$PROJECT_DIR/app/src/main/assets/hd/index.html"
          sha256sum "$HD_FILE" | awk '{print $1}' > "$RUNNER_TEMP/hd.before"
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          hp=root/"app/src/main/assets/home.html"
          kp=root/"app/src/main/java/com/alkamel/network/MainActivity.kt"
          s=hp.read_text(encoding="utf-8")
          old_live='''<section id="live" class="page"><button class="back" onclick="showPage('home')">→ الرئيسية</button><h2 class="heading">البث المباشر</h2><div class="panel"><p class="key">اختر البث المطلوب</p><button class="btn" onclick="player('org.videolan.vlc')">البث المباشر 1</button><button class="btn secondary" onclick="player('com.mxtech.videoplayer.ad')">البث المباشر 2</button><button class="btn" onclick="openHd()">بث HD</button><div class="notice" id="liveNotice"></div></div></section>'''
          new_live='''<section id="live" class="page"><button class="back" onclick="showPage('home')">→ الرئيسية</button><h2 class="heading">البث المباشر</h2><div class="panel"><p class="key">اختر البث المطلوب</p><button class="btn" onclick="goService('live1')">البث المباشر 1</button><button class="btn secondary" onclick="goService('live2')">البث المباشر 2</button><button class="btn" onclick="openHd()">بث HD</button><div class="notice" id="liveNotice"></div></div></section>'''
          if old_live not in s: raise SystemExit("FAIL: original live section differs; refusing blind patch")
          s=s.replace(old_live,new_live,1)
          old_speed='''<section id="speed" class="page"><button class="back" onclick="showPage('home')">→ الرئيسية</button><h2 class="heading">سرعة الكرت الحالية</h2><div class="panel"><div class="key">السرعة الحالية</div><div class="val" id="currentSpeed">يتم جلبها من بيانات الحساب…</div><div class="key" style="margin-top:18px">السرعات المعرفة في ملف إعدادات الموقع</div><div id="speedOptions"></div><button class="btn" id="applySpeed" onclick="applySelectedSpeed()" disabled>اعتماد السرعة المختارة</button><div class="notice" id="speedNotice">اختر السرعة ثم اعتمدها. سيتم تمرير الاختيار إلى دالة الموقع الأصلية.</div></div></section>'''
          new_speed='''<section id="speed" class="page"><button class="back" onclick="showPage('home')">→ الرئيسية</button><h2 class="heading">سرعة الكرت الحالية</h2><div class="panel"><div class="key">السرعة الحالية</div><div class="val" id="currentSpeed">يتم جلبها من بيانات الحساب…</div><div class="key" style="margin-top:18px">اختر السرعة المطلوبة</div><div id="speedOptions"></div><div class="notice" id="speedNotice">اختر السرعة وسيتم تطبيقها مباشرة.</div></div></section>'''
          if old_speed not in s: raise SystemExit("FAIL: original speed section differs; refusing blind patch")
          s=s.replace(old_speed,new_speed,1)
          if '</style>' not in s: raise SystemExit("FAIL: style block missing")
          s=s.replace('</style>','.speed-blink{display:inline-block;color:#7cecff;font-weight:700;animation:speedBlink 1.15s ease-in-out infinite}@keyframes speedBlink{0%,100%{opacity:1}50%{opacity:.25}}</style>',1)
          s=s.replace('<span id="homeCurrentSpeed">السرعة الحالية</span>','<span id="homeCurrentSpeed" class="speed-blink">يتم جلب السرعة…</span>',1)
          start=s.index('let siteConfig=null,selectedSpeed=null;')
          end=s.index('function googleAction(v)',start)
          js='''let siteConfig=null,selectedSpeed=null;
          function speedLabel(raw){const value=String(raw||'').split('|')[0].trim();if(!value)return 'غير محددة';const opts=(siteConfig&&siteConfig.speedOptions)||[];const found=opts.find(o=>String(o.value).split('|')[0]===value);return found?found.label:value;}
          function renderCurrentSpeed(){if(!lastData)return;const value=String(lastData.spes||'').split('|')[0];const label=speedLabel(value);$('currentSpeed').textContent=label;$('homeCurrentSpeed').textContent=label;$('spes').textContent=label;}
          function renderSpeeds(){if(siteConfig){fillSpeeds();renderCurrentSpeed();return;}const s=document.createElement('script');s.src='original/js/config%20(87).js';s.onload=()=>{siteConfig=window.siteConfig;fillSpeeds();renderCurrentSpeed();};s.onerror=()=>$('speedNotice').textContent='تعذر قراءة إعدادات السرعة الأصلية.';document.head.appendChild(s);}
          function fillSpeeds(){const list=(siteConfig&&siteConfig.speedOptions)||[];$('speedOptions').innerHTML='';list.forEach(o=>{const e=document.createElement('button');e.type='button';e.className='option';e.style.width='100%';e.style.color='inherit';e.style.font='inherit';e.style.textAlign='right';const current=String(lastData&&lastData.spes||'').split('|')[0];e.setAttribute('aria-pressed',String(current===o.value));const t=document.createElement('span');t.textContent=o.label+(current===o.value?' · السرعة الحالية':(o.selected?' · الافتراضية':''));e.appendChild(t);e.onclick=()=>{selectedSpeed=o.value;$('speedNotice').textContent='جارٍ تطبيق '+o.label+'…';const flag=(lastData&&lastData.spes&&String(lastData.spes).includes('|'))?String(lastData.spes).split('|')[1]:'*no**';if(window.AndroidBridge)AndroidBridge.applyNetworkSetting(o.value,flag);else $('speedNotice').textContent='يتطلب تطبيق السرعة من تطبيق Android.';};$('speedOptions').appendChild(e);});}
          '''
          s=s[:start]+js+s[end:]
          old_status="$('spes').textContent=d.spes||'—';const spesParts=String(d.spes||'').split('|');\n$('currentSpeed').textContent=spesParts[0]||'غير محددة';"
          new_status="$('spes').textContent=speedLabel(String(d.spes||'').split('|')[0]);const spesParts=String(d.spes||'').split('|');\n$('currentSpeed').textContent=speedLabel(spesParts[0]);$('homeCurrentSpeed').textContent=speedLabel(spesParts[0]);"
          if old_status not in s: raise SystemExit("FAIL: status speed renderer differs")
          s=s.replace(old_status,new_status,1)
          old_start="refreshStatus();setInterval(refreshStatus,30000);window.appBack=()=>showPage('home');"
          if old_start not in s: raise SystemExit("FAIL: startup sequence differs")
          s=s.replace(old_start,"renderSpeeds();refreshStatus();setInterval(refreshStatus,30000);window.appBack=()=>showPage('home');",1)
          k=kp.read_text(encoding="utf-8")
          old_cb='''"if(document.getElementById('speedNotice')){document.getElementById('speedNotice').textContent=${JSONObject.quote(message)};document.getElementById('applySpeed').disabled=false;}if(document.getElementById('googleNotice'))document.getElementById('googleNotice').textContent=${JSONObject.quote(message)};",'''
          new_cb='''"if(document.getElementById('speedNotice')){document.getElementById('speedNotice').textContent=${JSONObject.quote(message)};if(${success})setTimeout(function(){if(window.AndroidBridge)AndroidBridge.refresh();},1200);}if(document.getElementById('googleNotice'))document.getElementById('googleNotice').textContent=${JSONObject.quote(message)};",'''
          if old_cb not in k: raise SystemExit("FAIL: native command callback differs")
          k=k.replace(old_cb,new_cb,1)
          hp.write_text(s,encoding="utf-8")
          kp.write_text(k,encoding="utf-8")
          print("Applied native speed and live-stream fixes")
          PY
          HOME="$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q "original/js/config%20(87).js" "$HOME"
          grep -q "AndroidBridge.applyNetworkSetting(o.value,flag)" "$HOME"
          grep -q "goService('live1')" "$HOME"
          grep -q "goService('live2')" "$HOME"
          grep -q "speed-blink" "$HOME"
          ! grep -q "اعتماد السرعة المختارة" "$HOME"
          ! grep -q "v.textContent=o.value" "$HOME"
          grep -q "function openHd()" "$HOME"
          sha256sum "$HD_FILE" | awk '{print $1}' > "$RUNNER_TEMP/hd.after"
          cmp "$RUNNER_TEMP/hd.before" "$RUNNER_TEMP/hd.after"
          python3 "$PROJECT_DIR/scripts/validate_project.py"
      - name: Set unique application package ID
      - name: Set unique application package ID
        shell: bash
        run: |
          set -euxo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then GRADLE_FILE="$PROJECT_DIR/app/build.gradle"; fi
          test -f "$GRADLE_FILE"
          python3 - "$GRADLE_FILE" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          new_id = "com.mohammedkamel.alkamelnet.portal2026"
          pattern = r'(?m)^(\s*applicationId\s*(?:=\s*)?).*$'
          updated, count = re.subn(pattern, lambda m: m.group(1) + '"' + new_id + '"', s)
          if count != 1:
              raise SystemExit(f"Expected exactly one applicationId entry, found {count}; refusing unsafe edit")
          p.write_text(updated)
          print(f"Updated applicationId to {new_id}")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --version
          else
            echo "No Gradle wrapper; using Gradle 8.9 from setup-gradle"
            gradle --version
          fi
      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
      - name: Inspect APK package identity
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|application-label:)"
      - name: Verify and upload APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Alkamel-Net-debug.apk"
      - name: Package modified Android project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          cd "$(dirname "$PROJECT_DIR")"
          zip -qr "$GITHUB_WORKSPACE/output/Alkamel-Net-Android-Project.zip" "$(basename "$PROJECT_DIR")" -x '*/.gradle/*' '*/build/*' '*/.idea/*' '*/local.properties'
          test -s "$GITHUB_WORKSPACE/output/Alkamel-Net-Android-Project.zip"
      - name: Create single package with APK and project
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/output"
          test -s Alkamel-Net-debug.apk
          test -s Alkamel-Net-Android-Project.zip
          mkdir -p Alkamel-Net-Package
          cp Alkamel-Net-debug.apk Alkamel-Net-Package/
          cp Alkamel-Net-Android-Project.zip Alkamel-Net-Package/
          cat > Alkamel-Net-Package/اقرأني.txt <<'EOF'
          الكامل-نت
          يحتوي هذا الملف على:
          1- Alkamel-Net-debug.apk : ملف تثبيت التطبيق.
          2- Alkamel-Net-Android-Project.zip : ملفات مشروع Android المعدل.
          فك ضغط هذا الملف أولاً، ثم ثبّت APK أو فك ضغط ملف المشروع للعمل عليه.
          EOF
          zip -qr Alkamel-Net-Full-Package.zip Alkamel-Net-Package
          unzip -t Alkamel-Net-Full-Package.zip
          test -s Alkamel-Net-Full-Package.zip
      - name: Publish APK and project in one ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alkamel-net-build-${{ github.run_number }}
          name: Alkamel-Net build ${{ github.run_number }}
          files: output/Alkamel-Net-Full-Package.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
      - name: Upload optional Actions artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Alkamel-Net-APK
          path: output/Alkamel-Net-debug.apk
          if-no-files-found: error
          retention-days: 7
