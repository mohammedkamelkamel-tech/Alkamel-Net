name: Extract and Build Alkamel-Net APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose uploaded archive
        shell: bash
        run: |
          set -euxo pipefail
          echo "Repository files:"
          find . -maxdepth 3 -type f -not -path './.git/*' -printf '%p (%s bytes)\n'
          ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' ! -path './.git/*' -print -quit)"
          test -n "$ZIP_FILE" || { echo "::error::No ZIP archive found in repository"; exit 1; }
          echo "Using archive: $ZIP_FILE"
          ls -lh "$ZIP_FILE"
          file "$ZIP_FILE"
          unzip -t "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | head -200
          SETTINGS="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          test -n "$SETTINGS" || { echo "::error::ZIP extracted but settings.gradle(.kts) was not found"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle" || { echo "::error::Android app module build.gradle not found"; exit 1; }
          echo "Detected project root: $PROJECT_DIR"
          echo "Gradle files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \( -name '*gradle*' -o -name 'gradle-wrapper.properties' \) -print
      - name: Inspect original portal UI source
        shell: bash
        run: |
          set -euxo pipefail
          echo "HTML and JS assets:"
          find "$PROJECT_DIR/app/src/main/assets" -type f | sort
          echo "Relevant source matches:"
          grep -RniE 'البث المباشر|بث HD|سرعة الكرت|تحديثات جوجل|استراحة|استراحه|اعتماد السرعة|سرعة حالية|1536k|4096k|تم تحديث بيانات الحساب|اسم المشترك|m3u8|\.mp4|stream|live|tv\.html|openHd|applySelectedSpeed|speedOptions|function player' "$PROJECT_DIR/app/src/main/assets" --include='*.html' --include='*.js' | head -450 || true
          echo "Wrapper JavaScript lines 23-42:"
          sed -n '23,42p' "$PROJECT_DIR/app/src/main/assets/home.html"
          echo "Portal live controls:"
          sed -n '35,55p' "$PROJECT_DIR/app/src/main/assets/original/index.html"
      - name: Inspect stream URLs and speed handlers
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets" <<'PY'
          import pathlib,sys,re
          root=pathlib.Path(sys.argv[1])
          terms=('m3u8','live','stream','player(','openHd','speed','applySelectedSpeed','onchange','syy','changeSpeed','setSpeed')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in ('.html','.js','.json'): continue
              try: s=p.read_text(encoding='utf-8',errors='ignore')
              except Exception: continue
              for term in terms:
                  start=0; hits=0
                  while hits<4:
                      i=s.lower().find(term.lower(),start)
                      if i<0: break
                      a=max(0,i-180); b=min(len(s),i+320)
                      print(f'\nSOURCE {p.relative_to(root)} TERM {term}: {s[a:b]}')
                      start=i+len(term); hits+=1
          PY
      - name: Apply requested portal UI fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets/home.html" <<'PY'
          import pathlib, re, sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          # Move HD into the live-broadcast page and expose both live stream entries.
          s=s.replace('<button class="tile" onclick="showPage(\'hd\')"><div class="ico">HD</div><div><strong>بث HD</strong><br><small>مشاهدة عبر المشغل المدمج</small></div></button>','')
          s=s.replace('<section id="live" class="page"><button class="back" onclick="showPage(\'home\')">→ الرئيسية</button><h2 class="heading">البث المباشر</h2><div class="panel"><p class="key">اختر المشغل الذي تريد فتح البث من خلاله</p><button class="btn" onclick="player(\'org.videolan.vlc\')">فتح عبر VLC</button><button class="btn secondary" onclick="player(\'com.mxtech.videoplayer.ad\')">فتح عبر MX Player</button><div class="notice" id="liveNotice"></div></div></section>', '<section id="live" class="page"><button class="back" onclick="showPage(\'home\')">→ الرئيسية</button><h2 class="heading">البث المباشر</h2><div class="panel"><p class="key">اختر البث المطلوب</p><button class="btn" onclick="player(\'org.videolan.vlc\')">البث المباشر 1</button><button class="btn secondary" onclick="player(\'com.mxtech.videoplayer.ad\')">البث المباشر 2</button><button class="btn" onclick="openHd()">بث HD</button><div class="notice" id="liveNotice"></div></div></section>')
          # Make the two lounge tiles occupy one row.
          s=s.replace('<button class="tile" onclick="go(\'http://30.30.30.30:8096/web/index.html#!/home\')">','<div class="tile-row"><button class="tile" onclick="go(\'http://30.30.30.30:8096/web/index.html#!/home\')">').replace('<button class="tile" onclick="go(\'http://30.10.10.10/\')">','<button class="tile" onclick="go(\'http://30.10.10.10/\')">')
          # Close paired tile row after second lounge tile.
          s=s.replace('خدمات الاستراحة</small></div></button>','خدمات الاستراحة</small></div></button>',1)
          s=s.replace('خدمات الاستراحة</small></div></button>','خدمات الاستراحة</small></div></button></div>',1) if 'tile-row' in s else s
          # Subscriber label and masked card number (show first five digits only).
          s=s.replace('اسم المشترك</span>','رقم الكرت</span>')
          s=s.replace("$('username').textContent=d.username||'—';", "$('username').textContent=(d.username||'—').toString().replace(/^(\\d{5})\\d+$/, '$1'+'**');")
          # Remove time from successful refresh message.
          s=s.replace("'تم تحديث بيانات الحساب من بوابة الشبكة: '+new Date().toLocaleTimeString('ar')", "'تم تحديث بيانات الحساب من بوابة الشبكة'")
          # Current speed and Google status summaries on home tiles.
          s=s.replace('السرعات المتاحة في الشبكة</small>','<span id="homeCurrentSpeed">السرعة الحالية</span></small>')
          s=s.replace('حالة الخدمة</small>','<span id="homeGoogleStatus">حالة الخدمة</span></small>')
          # Show display labels, not raw bandwidth values, in options.
          s=s.replace("opt.textContent=item.value||item.name||item.label||'';", "opt.textContent=item.name||item.label||item.title||('الخيار '+(i+1));")
          # Selection confirmation without a separate apply button.
          s=s.replace("$('applySpeed').disabled=false;", "$('applySpeed').disabled=false; $('applySpeed').textContent='تم اختيار: '+(item.name||item.label||item.title||'السرعة المختارة');")
          s=s.replace("$('applySpeed').textContent='اعتماد السرعة المختارة';", "$('applySpeed').textContent='تم اختيار السرعة';")
          p.write_text(s,encoding='utf-8')
          print('Applied requested UI edits to',p)
          PY
          # Verify critical requested text and elements exist before building.
          grep -q 'رقم الكرت' "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q 'البث المباشر 1' "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q 'البث المباشر 2' "$PROJECT_DIR/app/src/main/assets/home.html"
      - name: Set unique application package ID
        shell: bash
        run: |
          set -euxo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then GRADLE_FILE="$PROJECT_DIR/app/build.gradle"; fi
          test -f "$GRADLE_FILE"
          python3 - "$GRADLE_FILE" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          new_id = "com.mohammedkamel.alkamelnet.portal2026"
          pattern = r'(?m)^(\s*applicationId\s*(?:=\s*)?).*$'
          updated, count = re.subn(pattern, lambda m: m.group(1) + '"' + new_id + '"', s)
          if count != 1:
              raise SystemExit(f"Expected exactly one applicationId entry, found {count}; refusing unsafe edit")
          p.write_text(updated)
          print(f"Updated applicationId to {new_id}")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --version
          else
            echo "No Gradle wrapper; using Gradle 8.9 from setup-gradle"
            gradle --version
          fi
      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
      - name: Inspect APK package identity
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|application-label:)"
      - name: Verify and upload APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Alkamel-Net-debug.apk"
      - name: Package modified Android project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          cd "$(dirname "$PROJECT_DIR")"
          zip -qr "$GITHUB_WORKSPACE/output/Alkamel-Net-Android-Project.zip" "$(basename "$PROJECT_DIR")" -x '*/.gradle/*' '*/build/*' '*/.idea/*' '*/local.properties'
          test -s "$GITHUB_WORKSPACE/output/Alkamel-Net-Android-Project.zip"
      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alkamel-net-build-${{ github.run_number }}
          name: Alkamel-Net build ${{ github.run_number }}
          files: |
            output/Alkamel-Net-debug.apk
            output/Alkamel-Net-Android-Project.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
      - name: Upload optional Actions artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Alkamel-Net-APK
          path: output/Alkamel-Net-debug.apk
          if-no-files-found: error
          retention-days: 7
