name: Extract and Build Alkamel-Net APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Alkamel-Net-Source-Portal-Integration.zip'
      - '.github/workflows/build-from-zip.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s Alkamel-Net-Source-Portal-Integration.zip
          mkdir -p extracted
          unzip -q Alkamel-Net-Source-Portal-Integration.zip -d extracted
          project="$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -n 1)"
          test -n "$project"
          project_dir="$(dirname "$project")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          test -f "$project_dir/app/build.gradle.kts" || test -f "$project_dir/app/build.gradle"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p output
          cp "$apk" output/Alkamel-Net-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Alkamel-Net-APK
          path: output/Alkamel-Net-debug.apk
          if-no-files-found: error
          retention-days: 30
