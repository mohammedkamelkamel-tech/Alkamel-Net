name: Build Alkamel-Net APK from repository source v1.2.8
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/Alkamel-Net-Android/**'
      - '.github/workflows/build-from-zip.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use latest Android project from repository
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/source/Alkamel-Net-Android"
          test -f "$PROJECT_DIR/settings.gradle.kts" -o -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle"
          test -s "$PROJECT_DIR/app/src/main/assets/home.html"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building repository source: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f -name '*gradle*' -print
      - name: Inspect original portal UI source
        shell: bash
        run: |
          set -euxo pipefail
          echo "HTML and JS assets:"
          find "$PROJECT_DIR/app/src/main/assets" -type f | sort
          echo "Relevant source matches:"
          grep -RniE 'البث المباشر|بث HD|سرعة الكرت|تحديثات جوجل|استراحة|استراحه|اعتماد السرعة|سرعة حالية|1536k|4096k|تم تحديث بيانات الحساب|اسم المشترك|m3u8|\.mp4|stream|live|tv\.html|openHd|applySelectedSpeed|speedOptions|function player' "$PROJECT_DIR/app/src/main/assets" --include='*.html' --include='*.js' | head -450 || true
          echo "Wrapper JavaScript lines 23-42:"
          sed -n '23,42p' "$PROJECT_DIR/app/src/main/assets/home.html"
          echo "Portal live controls:"
          sed -n '35,55p' "$PROJECT_DIR/app/src/main/assets/original/index.html"
      - name: Inspect stream URLs and speed handlers
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets" <<'PY'
          import pathlib,sys,re
          root=pathlib.Path(sys.argv[1])
          terms=('m3u8','live','stream','player(','openHd','speed','applySelectedSpeed','onchange','syy','changeSpeed','setSpeed')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in ('.html','.js','.json'): continue
              try: s=p.read_text(encoding='utf-8',errors='ignore')
              except Exception: continue
              for term in terms:
                  start=0; hits=0
                  while hits<4:
                      i=s.lower().find(term.lower(),start)
                      if i<0: break
                      a=max(0,i-180); b=min(len(s),i+320)
                      print(f'\nSOURCE {p.relative_to(root)} TERM {term}: {s[a:b]}')
                      start=i+len(term); hits+=1
          PY
      - name: Verify repository project and preserve HD stream
        shell: bash
        run: |
          set -euo pipefail
          HD_FILE="$PROJECT_DIR/app/src/main/assets/hd/index.html"
          test -s "$HD_FILE"
          grep -q "goService('live1')" "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q "goService('live2')" "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q "AndroidBridge.applyNetworkSetting(o.value,flag)" "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q "speed-blink" "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q "maskCardNumber(d.username)" "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q "status-blink" "$PROJECT_DIR/app/src/main/assets/home.html"
          ! grep -q "اعتماد السرعة المختارة" "$PROJECT_DIR/app/src/main/assets/home.html"
          ! grep -q "v.textContent=o.value" "$PROJECT_DIR/app/src/main/assets/home.html"
          python3 "$PROJECT_DIR/scripts/validate_project.py"
      - name: Set package identity and release version
        shell: bash
        run: |
          set -euxo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$GRADLE_FILE"
          python3 - "$GRADLE_FILE" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1])
          s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*applicationId\s*=\s*)"[^"]+"',r'\1"com.mohammedkamel.alkamelnet.portal2026"',s)
          if n!=1: raise SystemExit(f"Expected one applicationId, found {n}")
          s,n=re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+',r'\g<1>12',s)
          if n!=1: raise SystemExit(f"Expected one versionCode, found {n}")
          s,n=re.subn(r'(?m)^(\s*versionName\s*=\s*)"[^"]+"',r'\g<1>"1.2.8"',s)
          if n!=1: raise SystemExit(f"Expected one versionName, found {n}")
          p.write_text(s)
          print("Application ID and version set to 1.2.8 (12)")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --version
          else
            echo "No Gradle wrapper; using Gradle 8.9 from setup-gradle"
            gradle --version
          fi
      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
      - name: Inspect APK package identity
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|application-label:)"
      - name: Verify and upload APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Alkamel-Net-debug.apk"
      - name: Package modified Android project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          cd "$(dirname "$PROJECT_DIR")"
          zip -qr "$GITHUB_WORKSPACE/output/Alkamel-Net-Android-Project.zip" "$(basename "$PROJECT_DIR")" -x '*/.gradle/*' '*/build/*' '*/.idea/*' '*/local.properties'
          test -s "$GITHUB_WORKSPACE/output/Alkamel-Net-Android-Project.zip"
      - name: Create single package with APK and project
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/output"
          test -s Alkamel-Net-debug.apk
          test -s Alkamel-Net-Android-Project.zip
          mkdir -p Alkamel-Net-Package
          cp Alkamel-Net-debug.apk Alkamel-Net-Package/
          cp Alkamel-Net-Android-Project.zip Alkamel-Net-Package/
          cat > Alkamel-Net-Package/اقرأني.txt <<'EOF'
          الكامل-نت
          يحتوي هذا الملف على:
          1- Alkamel-Net-debug.apk : ملف تثبيت التطبيق.
          2- Alkamel-Net-Android-Project.zip : ملفات مشروع Android المعدل.
          فك ضغط هذا الملف أولاً، ثم ثبّت APK أو فك ضغط ملف المشروع للعمل عليه.
          EOF
          zip -qr Alkamel-Net-Full-Package.zip Alkamel-Net-Package
          unzip -t Alkamel-Net-Full-Package.zip
          test -s Alkamel-Net-Full-Package.zip
      - name: Publish APK and project in one ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alkamel-net-build-${{ github.run_number }}
          name: Alkamel-Net build ${{ github.run_number }}
          files: output/Alkamel-Net-Full-Package.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
      - name: Upload optional Actions artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Alkamel-Net-APK
          path: output/Alkamel-Net-debug.apk
          if-no-files-found: error
          retention-days: 7
