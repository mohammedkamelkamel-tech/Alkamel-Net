name: Extract and Build Alkamel-Net APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Alkamel-Net-Source-Portal-Integration.zip'
      - '.github/workflows/build-from-zip.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate and extract source archive
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_FILE="Alkamel-Net-Source-Portal-Integration.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' ! -path './.git/*' -print -quit)"
          fi
          test -n "$ZIP_FILE"
          test -s "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle"
          echo "Project root: $PROJECT_DIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages and accept licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify and upload APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Alkamel-Net-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Alkamel-Net-APK
          path: output/Alkamel-Net-debug.apk
          if-no-files-found: error
          retention-days: 30
