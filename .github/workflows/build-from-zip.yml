name: Build Alkamel-Net APK from the single project version
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'source/Alkamel-Net-Android/**'
      - '.github/workflows/build-from-zip.yml'
  push:
    branches: [main]
    paths:
      - 'source/Alkamel-Net-Android/**'
      - '.github/workflows/build-from-zip.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the latest successful project package (build 375)
        shell: bash
        run: |
          set -euxo pipefail
          BASE_PACKAGE="$GITHUB_WORKSPACE/Alkamel-Net-Full-Package-v2.0.0-code84-build-375.zip"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/${{ github.repository }}/releases/download/alkamel-net-v2.0.0-code84-build-375/Alkamel-Net-Full-Package-v2.0.0-code84.zip" \
            -o "$BASE_PACKAGE"
          test -s "$BASE_PACKAGE"
          mkdir -p "$GITHUB_WORKSPACE/base-package" "$GITHUB_WORKSPACE/extracted-source"
          unzip -q "$BASE_PACKAGE" -d "$GITHUB_WORKSPACE/base-package"
          mapfile -t PROJECT_ZIPS < <(find "$GITHUB_WORKSPACE/base-package" -type f -name 'Alkamel-Net-Android-Project-*.zip' | sort)
          if [ "${#PROJECT_ZIPS[@]}" -ne 1 ]; then
            echo "Expected exactly one Android project ZIP from build 375"
            find "$GITHUB_WORKSPACE/base-package" -type f -maxdepth 5 -print
            exit 1
          fi
          unzip -q "${PROJECT_ZIPS[0]}" -d "$GITHUB_WORKSPACE/extracted-source"
          mapfile -t GRADLE_FILES < <(find "$GITHUB_WORKSPACE/extracted-source" -type f \( -name settings.gradle.kts -o -name settings.gradle \) | sort)
          PROJECT_DIR=""
          for SETTINGS in "${GRADLE_FILES[@]}"; do
            CANDIDATE="$(dirname "$SETTINGS")"
            if [ -f "$CANDIDATE/app/build.gradle.kts" ] || [ -f "$CANDIDATE/app/build.gradle" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done
          test -n "$PROJECT_DIR"
          test -s "$PROJECT_DIR/app/src/main/assets/home.html"
          test -s "$PROJECT_DIR/scripts/validate_project.py"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building from the latest successful project package: build 375"
          grep -nE 'versionName|versionCode' "$PROJECT_DIR/app/build.gradle.kts"
          find "$PROJECT_DIR" -maxdepth 3 -type f -name '*gradle*' -print
      - name: Merge approved home design into the original 2.0.0 project
        shell: bash
        run: |
          set -euxo pipefail
          python3 - "$GITHUB_WORKSPACE/source/Alkamel-Net-Android/app/src/main/assets/home.html" "$PROJECT_DIR/app/src/main/assets/home.html" <<'PY'
          import pathlib,sys
          source=pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          target_path=pathlib.Path(sys.argv[2])
          target=target_path.read_text(encoding="utf-8")
          def region(text,start_marker,end_marker,label):
              start=text.find(start_marker)
              if start<0: raise SystemExit("Missing "+label+" start")
              end=text.find(end_marker,start)
              if end<0: raise SystemExit("Missing "+label+" end")
              return start,end+len(end_marker),text[start:end+len(end_marker)]
          ss,se,style=region(source,"<style>","</style>","approved styles")
          ts,te,_=region(target,"<style>","</style>","original styles")
          target=target[:ts]+style+target[te:]
          hs,he,header=region(source,'<header class="top">',"</header>","approved header")
          th,th_end,_=region(target,'<header class="top">',"</header>","original header")
          target=target[:th]+header+target[th_end:]
          sh=source.find('<section id="home"')
          she=source.find('<section id="support"',sh)
          th=target.find('<section id="home"')
          the=target.find('<section id="support"',th)
          if min(sh,she,th,the)<0: raise SystemExit("Could not isolate complete home sections")
          target=target[:th]+source[sh:she]+target[the:]
          xs,xe,extra=region(source,'<script id="home-ui-enhancements">',"</script>","home enhancement script")
          if 'id="home-ui-enhancements"' not in target:
              close=target.rfind("</body>")
              if close<0: raise SystemExit("Original project body closing tag missing")
              target=target[:close]+extra+target[close:]
          target_path.write_text(target,encoding="utf-8")
          for marker in ('id="homeCurrentSpeed"','id="homeTimeLeft"','id="homeRemain"','id="homeChatFeed"','id="homeBottomNav"','home-ui-enhancements'):
              if marker not in target: raise SystemExit("Home merge check failed: "+marker)
          print("PASS - reference home layout merged; original application scripts and native integration preserved")
          PY
      - name: Restore approved launcher artwork
        shell: bash
        run: |
          set -euxo pipefail
          ICON_B64="$PROJECT_DIR/app/src/main/res/drawable-nodpi/ic_launcher.webp.b64"
          ICON="$PROJECT_DIR/app/src/main/res/drawable-nodpi/ic_launcher.webp"
          if [ -s "$ICON_B64" ]; then
            base64 --decode "$ICON_B64" > "$ICON"
            rm "$ICON_B64"
          elif [ -s "$ICON" ]; then
            echo "Using launcher artwork already present in the 2.0.0 source archive"
          else
            echo "No WebP launcher artwork or approved base64 source found"
            find "$PROJECT_DIR/app/src/main/res" -maxdepth 3 -type f | sort | head -120
            exit 1
          fi
          python3 - "$ICON" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); b=p.read_bytes()
          if len(b)<4000 or b[:4]!=b'RIFF' or b[8:12]!=b'WEBP':
              raise SystemExit('Invalid launcher artwork: expected a valid WebP file')
          print(f'PASS - launcher artwork verified ({len(b)} bytes)')
          PY
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          cp "$ICON" "$PROJECT_DIR/app/src/main/assets/brand-icon.webp"
          python3 - "$ICON" "$PROJECT_DIR/app/src/main/assets/home.html" <<'PY'
          import base64,pathlib,sys
          icon=base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode("ascii")
          page=pathlib.Path(sys.argv[2])
          html=page.read_text(encoding="utf-8")
          old='src="brand-icon.webp"'
          new='src="data:image/webp;base64,'+icon+'"'
          if old not in html: raise SystemExit("Brand image source marker missing")
          page.write_text(html.replace(old,new,1),encoding="utf-8")
          print("PASS - approved launcher artwork embedded in home header")
          PY
          test -s "$PROJECT_DIR/app/src/main/assets/brand-icon.webp"
      - name: Inspect original portal UI source
        shell: bash
        run: |
          set -euxo pipefail
          echo "HTML and JS assets:"
          find "$PROJECT_DIR/app/src/main/assets" -type f | sort
          echo "Relevant source matches:"
          grep -RniE 'البث المباشر|بث HD|سرعة الكرت|تحديثات جوجل|استراحة|استراحه|اعتماد السرعة|سرعة حالية|1536k|4096k|تم تحديث بيانات الحساب|اسم المشترك|m3u8|\.mp4|stream|live|tv\.html|openHd|applySelectedSpeed|speedOptions|function player' "$PROJECT_DIR/app/src/main/assets" --include='*.html' --include='*.js' | head -450 || true
          echo "Wrapper JavaScript lines 23-42:"
          sed -n '23,42p' "$PROJECT_DIR/app/src/main/assets/home.html"
          echo "Portal live controls:"
          sed -n '35,55p' "$PROJECT_DIR/app/src/main/assets/original/index.html"
      - name: Inspect stream URLs and speed handlers
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets" <<'PY'
          import pathlib,sys,re
          root=pathlib.Path(sys.argv[1])
          terms=('m3u8','live','stream','player(','openHd','speed','applySelectedSpeed','onchange','syy','changeSpeed','setSpeed')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in ('.html','.js','.json'): continue
              try: s=p.read_text(encoding='utf-8',errors='ignore')
              except Exception: continue
              for term in terms:
                  start=0; hits=0
                  while hits<4:
                      i=s.lower().find(term.lower(),start)
                      if i<0: break
                      a=max(0,i-180); b=min(len(s),i+320)
                      print(f'\nSOURCE {p.relative_to(root)} TERM {term}: {s[a:b]}')
                      start=i+len(term); hits+=1
          PY
      - name: Inspect remaining validator expectations
        shell: bash
        run: |
          set -euo pipefail
          grep -n -B 8 -A 14 -E 'new شبكة الكامل header and approved icon|home tiles place network test beside support|leisure main section groups both lounges beside live tile' "$PROJECT_DIR/scripts/validate_project.py" || true
      - name: Verify repository project and preserve HD stream
        shell: bash
        run: |
          set -euo pipefail
          HD_FILE="$PROJECT_DIR/app/src/main/assets/hd/index.html"
          test -s "$HD_FILE"
          grep -q "goService('live1')" "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q "goService('live2')" "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q "AndroidBridge.applyNetworkSetting(o.value,flag)" "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q "speed-blink" "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q "maskCardNumber(d.username)" "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q "status-blink" "$PROJECT_DIR/app/src/main/assets/home.html"
          ! grep -q "اعتماد السرعة المختارة" "$PROJECT_DIR/app/src/main/assets/home.html"
          ! grep -q "v.textContent=o.value" "$PROJECT_DIR/app/src/main/assets/home.html"
          python3 "$PROJECT_DIR/scripts/validate_project.py"
      - name: Set package identity and preserve validated release version
        shell: bash
        run: |
          set -euxo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$GRADLE_FILE"
          python3 - "$GRADLE_FILE" <<'PY'
          import os,pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*applicationId\s*=\s*)"[^"]+"',r'\1"com.mohammedkamel.alkamelnet.portal2026"',s)
          if n!=1: raise SystemExit(f"Expected one applicationId, found {n}")
          version=re.search(r'(?m)^\s*versionName\s*=\s*"([^"]+)"',s)
          code=re.search(r'(?m)^\s*versionCode\s*=\s*(\d+)',s)
          if not version or not code: raise SystemExit("Missing versionName/versionCode in Gradle")
          if not re.fullmatch(r"\d+\.\d+\.\d+",version.group(1)): raise SystemExit("Invalid semantic versionName")
          if int(code.group(1))<1: raise SystemExit("Invalid versionCode")
          p.write_text(s)
          with open(os.environ["GITHUB_ENV"],"a") as env:
              env.write("APP_VERSION="+version.group(1)+"\n")
              env.write("VERSION_CODE="+code.group(1)+"\n")
          print(f"Application ID set; preserving source version {version.group(1)} ({code.group(1)})")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          packages: platform-tools
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --version
          else
            echo "No Gradle wrapper; using Gradle 8.9 from setup-gradle"
            gradle --version
          fi
      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
      - name: Inspect APK package identity
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -E "^(package:|application-label:|application-icon-)"
          python3 - "$PROJECT_DIR/app/build.gradle.kts" "$BADGING" <<'PY'
          import pathlib,re,sys
          gradle=pathlib.Path(sys.argv[1]).read_text()
          badging=sys.argv[2]
          name=re.search(r'(?m)^\s*versionName\s*=\s*"([^"]+)"',gradle)
          code=re.search(r'(?m)^\s*versionCode\s*=\s*(\d+)',gradle)
          if not name or not code: raise SystemExit("FAIL - missing source version")
          match=re.search(r"^package:.*?versionCode='(\d+)'.*?versionName='([^']+)'",badging,re.M)
          if not match: raise SystemExit("FAIL - APK version metadata missing")
          if match.group(1)!=code.group(1) or match.group(2)!=name.group(1):
              raise SystemExit(f"FAIL - APK version {match.group(2)} ({match.group(1)}) differs from source {name.group(1)} ({code.group(1)})")
          print(f"PASS - APK version matches source: {name.group(1)} ({code.group(1)})")
          PY
      - name: Verify packaged launcher artwork
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          unzip -p "$APK" res/drawable-nodpi-v4/ic_launcher.webp > /tmp/alkamel-launcher.webp
          python3 - /tmp/alkamel-launcher.webp <<'PY'
          import pathlib,sys
          b=pathlib.Path(sys.argv[1]).read_bytes()
          if len(b)<4000 or b[:4]!=b'RIFF' or b[8:12]!=b'WEBP':
              raise SystemExit('FAIL - packaged launcher icon is missing or invalid')
          print(f'PASS - APK contains approved launcher artwork ({len(b)} bytes)')
          PY
      - name: Verify and upload APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Alkamel-Net-v${APP_VERSION}-code${VERSION_CODE}.apk"
      - name: Package modified Android project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          cd "$(dirname "$PROJECT_DIR")"
          zip -qr "$GITHUB_WORKSPACE/output/Alkamel-Net-Android-Project-v${APP_VERSION}-code${VERSION_CODE}.zip" "$(basename "$PROJECT_DIR")" -x '*/.gradle/*' '*/build/*' '*/.idea/*' '*/local.properties'
          test -s "$GITHUB_WORKSPACE/output/Alkamel-Net-Android-Project-v${APP_VERSION}-code${VERSION_CODE}.zip"
      - name: Create single package with APK and project
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/output"
          APK_NAME="Alkamel-Net-v${APP_VERSION}-code${VERSION_CODE}.apk"
          PROJECT_NAME="Alkamel-Net-Android-Project-v${APP_VERSION}-code${VERSION_CODE}.zip"
          PACKAGE_DIR="Alkamel-Net-v${APP_VERSION}-code${VERSION_CODE}"
          FULL_PACKAGE="Alkamel-Net-Full-Package-v${APP_VERSION}-code${VERSION_CODE}.zip"
          test -s "$APK_NAME" && test -s "$PROJECT_NAME"
          mkdir -p "$PACKAGE_DIR"
          cp "$APK_NAME" "$PROJECT_NAME" "$PACKAGE_DIR/"
          printf 'شبكة الكامل\nالإصدار: %s\nرقم الإصدار الداخلي: %s\nرقم تشغيل البناء: %s\n' "$APP_VERSION" "$VERSION_CODE" "$GITHUB_RUN_NUMBER" > "$PACKAGE_DIR/اقرأني.txt"
          zip -qr "$FULL_PACKAGE" "$PACKAGE_DIR"
          unzip -t "$FULL_PACKAGE"
          unzip -Z1 "$FULL_PACKAGE" | grep -F "$PACKAGE_DIR/$APK_NAME"
          unzip -Z1 "$FULL_PACKAGE" | grep -F "$PACKAGE_DIR/$PROJECT_NAME"
          unzip -p "$FULL_PACKAGE" "$PACKAGE_DIR/اقرأني.txt" | grep -F "الإصدار: $APP_VERSION"
          unzip -p "$FULL_PACKAGE" "$PACKAGE_DIR/اقرأني.txt" | grep -F "رقم الإصدار الداخلي: $VERSION_CODE"
          test -s "$FULL_PACKAGE"
      - name: Publish APK and project in one ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alkamel-net-v${{ env.APP_VERSION }}-code${{ env.VERSION_CODE }}-build-${{ github.run_number }}
          name: شبكة الكامل v${{ env.APP_VERSION }} (versionCode ${{ env.VERSION_CODE }}) - build ${{ github.run_number }}
          files: output/Alkamel-Net-Full-Package-v${{ env.APP_VERSION }}-code${{ env.VERSION_CODE }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
      - name: Upload optional Actions artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Alkamel-Net-v${{ env.APP_VERSION }}-code${{ env.VERSION_CODE }}
          path: |
            output/Alkamel-Net-v${{ env.APP_VERSION }}-code${{ env.VERSION_CODE }}.apk
            output/Alkamel-Net-Android-Project-v${{ env.APP_VERSION }}-code${{ env.VERSION_CODE }}.zip
            output/Alkamel-Net-Full-Package-v${{ env.APP_VERSION }}-code${{ env.VERSION_CODE }}.zip
          if-no-files-found: error
          retention-days: 7
