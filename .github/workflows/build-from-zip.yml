name: Build Alkamel-Net 3.0.0 from uploaded merged ZIP

on:
  workflow_dispatch:
  push:
    branches: ["3.0.0"]
    paths:
      - "Alkamel-Net-3.0.0-Full-Merged-Source.zip"
      - ".github/workflows/build-from-zip.yml"
  pull_request:
    branches: ["3.0.0"]
    paths:
      - "Alkamel-Net-3.0.0-Full-Merged-Source.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

concurrency:
  group: alkamel-net-3-0-0-uploaded-zip-build
  cancel-in-progress: true

jobs:
  build-merged-3-0-0:
    name: Build the uploaded Alkamel-Net-3.0.0-Full-Merged-Source.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - name: Confirm and extract the exact uploaded merged ZIP
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/Alkamel-Net-3.0.0-Full-Merged-Source.zip"
          test -s "$ZIP_FILE"
          unzip -t "$ZIP_FILE"
          mkdir -p "$GITHUB_WORKSPACE/merged-upload"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/merged-upload"
          PROJECT_DIR="$GITHUB_WORKSPACE/merged-upload/Alkamel-Net-3.0.0-Merged"
          test -s "$PROJECT_DIR/settings.gradle.kts"
          test -s "$PROJECT_DIR/app/build.gradle.kts"
          test -s "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -s "$PROJECT_DIR/app/src/main/assets/googleai/index.html"
          test -s "$PROJECT_DIR/app/src/main/assets/home.html"
          test -s "$PROJECT_DIR/scripts/validate_merged_project.py"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Building ONLY the project extracted from: $ZIP_FILE"
          echo "Extracted project: $PROJECT_DIR"

      - name: Validate uploaded source identity and complete merge
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          python3 scripts/validate_merged_project.py
          python3 - <<'PY'
          import pathlib,re,json
          p=pathlib.Path("app/build.gradle.kts")
          s=p.read_text()
          checks={
            "versionName": r'(?m)^\s*versionName\s*=\s*"([^"]+)"',
            "versionCode": r'(?m)^\s*versionCode\s*=\s*(\d+)',
            "applicationId": r'(?m)^\s*applicationId\s*=\s*"([^"]+)"',
          }
          values={k:re.search(v,s).group(1) if re.search(v,s) else None for k,v in checks.items()}
          expected={"versionName":"3.0.0","versionCode":"300","applicationId":"com.mohammedkamel.alkamelnet.portal2026.v300"}
          if values != expected:
              raise SystemExit(f"Wrong source selected; expected {expected}, found {values}")
          audit=json.loads(pathlib.Path("MERGE-AUDIT.json").read_text())
          if audit.get("output_version")!="3.0.0" or audit.get("version_code")!=300:
              raise SystemExit("Merge audit does not identify version 3.0.0 / code 300")
          print("PASS - exact uploaded ZIP is the independent 3.0.0 source")
          print(values)
          PY
          echo "APP_VERSION=3.0.0" >> "$GITHUB_ENV"
          echo "VERSION_CODE=300" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          packages: platform-tools

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK from the uploaded ZIP only
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK package and version
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.mohammedkamel.alkamelnet.portal2026.v300' versionCode='300' versionName='3.0.0'"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Alkamel-Net-3.0.0-code300-debug.apk"
          cp "$SOURCE_ZIP" "$GITHUB_WORKSPACE/output/Alkamel-Net-3.0.0-Full-Merged-Source.zip"

      - name: Upload APK and the exact source ZIP as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alkamel-Net-3.0.0-code300
          path: |
            output/Alkamel-Net-3.0.0-code300-debug.apk
            output/Alkamel-Net-3.0.0-Full-Merged-Source.zip
          if-no-files-found: error
          retention-days: 30
