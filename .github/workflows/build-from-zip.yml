name: Extract and Build Alkamel-Net APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose uploaded archive
        shell: bash
        run: |
          set -euxo pipefail
          echo "Repository files:"
          find . -maxdepth 3 -type f -not -path './.git/*' -printf '%p (%s bytes)\n'
          ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' ! -path './.git/*' -print -quit)"
          test -n "$ZIP_FILE" || { echo "::error::No ZIP archive found in repository"; exit 1; }
          echo "Using archive: $ZIP_FILE"
          ls -lh "$ZIP_FILE"
          file "$ZIP_FILE"
          unzip -t "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | head -200
          SETTINGS="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          test -n "$SETTINGS" || { echo "::error::ZIP extracted but settings.gradle(.kts) was not found"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle" || { echo "::error::Android app module build.gradle not found"; exit 1; }
          echo "Detected project root: $PROJECT_DIR"
          echo "Gradle files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \( -name '*gradle*' -o -name 'gradle-wrapper.properties' \) -print
      - name: Inspect original portal UI source
        shell: bash
        run: |
          set -euxo pipefail
          echo "HTML and JS assets:"
          find "$PROJECT_DIR/app/src/main/assets" -type f | sort
          echo "Relevant source matches:"
          grep -RniE 'البث المباشر|بث HD|سرعة الكرت|تحديثات جوجل|استراحة|استراحه|اعتماد السرعة|سرعة حالية|1536k|4096k|تم تحديث بيانات الحساب|اسم المشترك|m3u8|\.mp4|stream|live|tv\.html|openHd|applySelectedSpeed|speedOptions|function player' "$PROJECT_DIR/app/src/main/assets" --include='*.html' --include='*.js' | head -450 || true
          echo "Wrapper JavaScript lines 23-42:"
          sed -n '23,42p' "$PROJECT_DIR/app/src/main/assets/home.html"
          echo "Portal live controls:"
          sed -n '35,55p' "$PROJECT_DIR/app/src/main/assets/original/index.html"
      - name: Inspect stream URLs and speed handlers
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets" <<'PY'
          import pathlib,sys,re
          root=pathlib.Path(sys.argv[1])
          terms=('m3u8','live','stream','player(','openHd','speed','applySelectedSpeed','onchange','syy','changeSpeed','setSpeed')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in ('.html','.js','.json'): continue
              try: s=p.read_text(encoding='utf-8',errors='ignore')
              except Exception: continue
              for term in terms:
                  start=0; hits=0
                  while hits<4:
                      i=s.lower().find(term.lower(),start)
                      if i<0: break
                      a=max(0,i-180); b=min(len(s),i+320)
                      print(f'\nSOURCE {p.relative_to(root)} TERM {term}: {s[a:b]}')
                      start=i+len(term); hits+=1
          PY
      - name: Apply and verify portal UI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets/home.html" "$PROJECT_DIR/app/src/main/assets/original/config.js" <<'PY'
          import pathlib,re,sys
          hp,cp=map(pathlib.Path,sys.argv[1:])
          s=hp.read_text(encoding="utf-8")
          cfg=cp.read_text(encoding="utf-8")
          # Read the actual named speed options from the shipped site config at runtime.
          # Keep the original HD page and its openHd() implementation completely untouched.
          old_speed='<section id="speed" class="page"><button class="back" onclick="showPage(\\'home\\')">→ الرئيسية</button><h2 class="heading">سرعة الكرت الحالية</h2><div class="panel"><div class="key">السرعة الحالية</div><div class="val" id="currentSpeed">يتم جلبها من بيانات الحساب…</div><div class="key" style="margin-top:18px">السرعات المعرفة في ملف إعدادات الموقع</div><div id="speedOptions"></div><button class="btn" id="applySpeed" onclick="applySelectedSpeed()" disabled>اعتماد السرعة المختارة</button><div class="notice" id="speedNotice">اختر السرعة ثم اعتمدها. سيتم تمرير الاختيار إلى دالة الموقع الأصلية.</div></div></section>'
          new_speed='<section id="speed" class="page"><button class="back" onclick="showPage(\\'home\\')">→ الرئيسية</button><h2 class="heading">سرعة الكرت الحالية</h2><div class="panel"><div class="key">السرعة الحالية</div><div class="val" id="currentSpeed">يتم جلبها من بيانات الحساب…</div><div class="key" style="margin-top:18px">اختر السرعة المطلوبة</div><div id="speedOptions"></div><div class="notice" id="speedNotice">اختر السرعة وسيتم تطبيقها مباشرة.</div></div></section>'
          if old_speed not in s: raise SystemExit("FAIL: exact speed section was not found; refusing to build")
          s=s.replace(old_speed,new_speed,1)
          # Show the two configured live service addresses, without routing them through one shared stream.
          old_live='<section id="live" class="page"><button class="back" onclick="showPage(\\'home\\')">→ الرئيسية</button><h2 class="heading">البث المباشر</h2><div class="panel"><p class="key">اختر المشغل الذي تريد فتح البث من خلاله</p><button class="btn" onclick="player(\\'org.videolan.vlc\\')">فتح عبر VLC</button><button class="btn secondary" onclick="player(\\'com.mxtech.videoplayer.ad\\')">فتح عبر MX Player</button><div class="notice" id="liveNotice"></div></div></section>'
          new_live='<section id="live" class="page"><button class="back" onclick="showPage(\\'home\\')">→ الرئيسية</button><h2 class="heading">البث المباشر</h2><div class="panel"><p class="key">اختر البث المطلوب</p><button class="btn" onclick="goService(\\'live1\\')">البث المباشر 1</button><button class="btn secondary" onclick="goService(\\'live2\\')">البث المباشر 2</button><div class="notice" id="liveNotice"></div></div></section>'
          if old_live not in s: raise SystemExit("FAIL: exact live section was not found; refusing to build")
          s=s.replace(old_live,new_live,1)
          # Remove raw speed values from the option cards and apply the selected value immediately.
          a=s.index('function fillSpeeds(){')
          b=s.index('function applySelectedSpeed(){',a)
          c=s.index('}',b)+1
          fill='''function fillSpeeds(){let list=(siteConfig&&siteConfig.speedOptions)||[];$('speedOptions').innerHTML='';list.forEach(o=>{let e=document.createElement('button');e.type='button';e.className='option';e.style.width='100%';e.style.color='inherit';e.style.font='inherit';e.style.textAlign='right';let t=document.createElement('span');t.textContent=o.label+(o.selected?' · الافتراضية':'');e.append(t);e.onclick=()=>{selectedSpeed=o.value;$('speedNotice').textContent='جارٍ تطبيق '+o.label+'…';if(window.AndroidBridge){AndroidBridge.applyNetworkSetting(o.value,(lastData&&lastData.spes&&String(lastData.spes).includes('|'))?String(lastData.spes).split('|')[1]:'*no**');}else{$('speedNotice').textContent='يتطلب تطبيق السرعة من تطبيق Android.';}};$('speedOptions').appendChild(e)})}'''
          s=s[:a]+fill+s[c:]
          # Current speed name in status and home tile; resolve raw bandwidth value against config entries.
          marker='let siteConfig=null,selectedSpeed=null;'
          if marker not in s: raise SystemExit("FAIL: speed state marker missing")
          s=s.replace(marker,marker+'''function speedLabel(raw){let v=String(raw||'').split('|')[0];let opts=(siteConfig&&siteConfig.speedOptions)||[];let found=opts.find(x=>String(x.value)===v);return found?found.label:(v||'غير محددة')}''',1)
          s=s.replace("$('currentSpeed').textContent=d.spes||'—';","$('currentSpeed').textContent=speedLabel(d.spes);$('homeCurrentSpeed').textContent=speedLabel(d.spes);")
          s=s.replace('السرعات المتاحة في الشبكة</small>','<span id="homeCurrentSpeed" class="speed-blink">يتم جلب السرعة…</span></small>')
          if 'homeCurrentSpeed' not in s: raise SystemExit("FAIL: home speed indicator missing")
          s=s.replace("function renderSpeeds(){if(siteConfig){fillSpeeds();return}","function renderSpeeds(){if(siteConfig){fillSpeeds();return}")
          # Keep the actual HD tile, page and functions unchanged.
          hp.write_text(s,encoding="utf-8")
          print("Patched exact speed and live sections; HD untouched.")
          PY
          # Hard gates: do not publish an APK if requested UI changes did not land.
          ! grep -q 'اعتماد السرعة المختارة' "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q 'البث المباشر 1' "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q 'البث المباشر 2' "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q 'AndroidBridge.applyNetworkSetting(o.value' "$PROJECT_DIR/app/src/main/assets/home.html"
          ! grep -q 'v.textContent=o.value' "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q 'function openHd()' "$PROJECT_DIR/app/src/main/assets/home.html"
          grep -q 'function speedLabel(raw)' "$PROJECT_DIR/app/src/main/assets/home.html"
      - name: Set unique application package ID
        shell: bash
        run: |
          set -euxo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then GRADLE_FILE="$PROJECT_DIR/app/build.gradle"; fi
          test -f "$GRADLE_FILE"
          python3 - "$GRADLE_FILE" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          new_id = "com.mohammedkamel.alkamelnet.portal2026"
          pattern = r'(?m)^(\s*applicationId\s*(?:=\s*)?).*$'
          updated, count = re.subn(pattern, lambda m: m.group(1) + '"' + new_id + '"', s)
          if count != 1:
              raise SystemExit(f"Expected exactly one applicationId entry, found {count}; refusing unsafe edit")
          p.write_text(updated)
          print(f"Updated applicationId to {new_id}")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --version
          else
            echo "No Gradle wrapper; using Gradle 8.9 from setup-gradle"
            gradle --version
          fi
      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
      - name: Inspect APK package identity
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|application-label:)"
      - name: Verify and upload APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Alkamel-Net-debug.apk"
      - name: Package modified Android project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          cd "$(dirname "$PROJECT_DIR")"
          zip -qr "$GITHUB_WORKSPACE/output/Alkamel-Net-Android-Project.zip" "$(basename "$PROJECT_DIR")" -x '*/.gradle/*' '*/build/*' '*/.idea/*' '*/local.properties'
          test -s "$GITHUB_WORKSPACE/output/Alkamel-Net-Android-Project.zip"
      - name: Create single package with APK and project
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/output"
          test -s Alkamel-Net-debug.apk
          test -s Alkamel-Net-Android-Project.zip
          mkdir -p Alkamel-Net-Package
          cp Alkamel-Net-debug.apk Alkamel-Net-Package/
          cp Alkamel-Net-Android-Project.zip Alkamel-Net-Package/
          cat > Alkamel-Net-Package/اقرأني.txt <<'EOF'
          الكامل-نت
          يحتوي هذا الملف على:
          1- Alkamel-Net-debug.apk : ملف تثبيت التطبيق.
          2- Alkamel-Net-Android-Project.zip : ملفات مشروع Android المعدل.
          فك ضغط هذا الملف أولاً، ثم ثبّت APK أو فك ضغط ملف المشروع للعمل عليه.
          EOF
          zip -qr Alkamel-Net-Full-Package.zip Alkamel-Net-Package
          unzip -t Alkamel-Net-Full-Package.zip
          test -s Alkamel-Net-Full-Package.zip
      - name: Publish APK and project in one ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alkamel-net-build-${{ github.run_number }}
          name: Alkamel-Net build ${{ github.run_number }}
          files: output/Alkamel-Net-Full-Package.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
      - name: Upload optional Actions artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Alkamel-Net-APK
          path: output/Alkamel-Net-debug.apk
          if-no-files-found: error
          retention-days: 7
