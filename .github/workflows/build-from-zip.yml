name: Build Alkamel-Net directly from Build 370 source
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'source/Alkamel-Net-Android/**'
      - '.github/workflows/build-from-zip.yml'
  push:
    branches: ['**']
    paths:
      - 'source/Alkamel-Net-Android/**'
      - '.github/workflows/build-from-zip.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the approved Build 370 project source
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/source/Alkamel-Net-Android"
          test -s "$PROJECT_DIR/settings.gradle.kts" || test -s "$PROJECT_DIR/settings.gradle"
          test -s "$PROJECT_DIR/app/build.gradle.kts" || test -s "$PROJECT_DIR/app/build.gradle"
          test -s "$PROJECT_DIR/app/src/main/assets/home.html"
          test -s "$PROJECT_DIR/scripts/validate_project.py"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building the repository project directly; no newer release archive is substituted."
          grep -nE 'versionName|versionCode|minSdk|targetSdk' "$PROJECT_DIR/app/build.gradle.kts"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate preserved application functions and JavaScript
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          python3 scripts/validate_project.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          packages: platform-tools
      - name: Build Android debug APK from Build 370 source
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
      - name: Verify APK and project package
        shell: bash
        run: |
          set -euxo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|application-label:|application-icon-)"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Alkamel-Net-Build370-debug.apk"
          cd "$(dirname "$PROJECT_DIR")"
          zip -qr "$GITHUB_WORKSPACE/output/Alkamel-Net-Build370-Android-Project.zip" Alkamel-Net-Android -x '*/.gradle/*' '*/build/*' '*/.idea/*' '*/local.properties'
          test -s "$GITHUB_WORKSPACE/output/Alkamel-Net-Build370-Android-Project.zip"
          unzip -t "$GITHUB_WORKSPACE/output/Alkamel-Net-Build370-Android-Project.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Alkamel-Net-Build370-validated-debug
          path: |
            output/Alkamel-Net-Build370-debug.apk
            output/Alkamel-Net-Build370-Android-Project.zip
          if-no-files-found: error
          retention-days: 14
