name: Android Build 2.0.0

on:
  push:
    branches:
      - release/2.0.0

permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/2.0.0
          fetch-depth: 0

      - name: Extract uploaded project source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="Alkamel-Net-Android-2.0.0-source.zip"
          test -f "$ARCHIVE"
          mkdir -p /tmp/alkamel-src
          unzip -q "$ARCHIVE" -d /tmp/alkamel-src
          test -d /tmp/alkamel-src/Alkamel-Net-Android
          cp -a /tmp/alkamel-src/Alkamel-Net-Android/. .
          rm -rf /tmp/alkamel-src "$ARCHIVE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Android 2.0.0 project source [skip ci]"
            git push origin HEAD:release/2.0.0
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate source
        run: python3 scripts/validate_project.py

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alkamel-Net-2.0.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
